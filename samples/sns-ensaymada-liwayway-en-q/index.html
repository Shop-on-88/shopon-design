<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liwayway Panaderia · Noche Buena Ensaymada Box Social Ad Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#cfeadf;color:#2b1d16;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px);background-size:40px 40px}
.top{height:34px;background:repeating-linear-gradient(90deg,#c8283a 0 40px,#fff7e6 40px 80px);position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-16px;height:16px;background:radial-gradient(circle at 20px 0,#c8283a 16px,transparent 17px) 0 0/80px 16px repeat-x,radial-gradient(circle at 60px 0,#fff7e6 16px,transparent 17px) 0 0/80px 16px repeat-x}
.wrap{max-width:1200px;margin:0 auto;padding:50px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-size:14px;font-weight:700;letter-spacing:.2em;color:#1f5c4d}
.hd h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(32px,4.4vw,54px);margin-top:8px;line-height:1.1;letter-spacing:-.01em}
.hd h1 em{font-style:normal;color:#9e1c2c;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:#fff7e6;color:#3a2c24;border:1.5px solid rgba(43,29,22,.2)}
.chips span.k{background:#1f5c4d;color:#fff7e6;border-color:#1f5c4d;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:#c8283a;color:#fff7e6;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;border:2.5px solid #2b1d16;box-shadow:4px 4px 0 #2b1d16}
.cta:hover{background:#9e1c2c}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff7e6;padding:10px;border-radius:16px;border:2.5px solid #2b1d16;box-shadow:6px 6px 0 #2b1d16}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#5d4c40;padding:10px 4px 2px;font-weight:500}
figcaption b{font-weight:700;color:#9e1c2c}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1f5c4d;border-top:3px solid #2b1d16;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#dff1e9}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SOCIAL AD SET · SD-SN40</small>

   <div class="chips"><span class="k">Christmas pre-order</span><span>Peso pricing</span><span>Feed 1:1</span><span>Portrait 4:5</span><span>Story 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">Get this design <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="Liwayway Panaderia feed ad, open gift box of six ensaymadas with a red ribbon lid, 480 pesos, 1:1" width="1080" height="1080"></a><figcaption><b>Feed</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="Liwayway Panaderia portrait ad top-down view of six ensaymadas in a box, price card and pick-up dates, 4:5" width="1080" height="1350"></a><figcaption><b>Portrait</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="Liwayway Panaderia story ad close-up ensaymada on a plate beside a gift box, three pre-order steps, 9:16" width="1080" height="1920"></a><figcaption><b>Story</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>Want ads like this for your shop?</p><a class="cta" href="https://design.shoponph.online/#inquiry">Get this design</a></div>
</body>
</html>
