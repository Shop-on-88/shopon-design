<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butas Donut Bar · Noche Buena Dozen SNS Ad Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#142A8C}
body{font-family:'Outfit',sans-serif;color:#FFF3DE;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(circle at 1px 1px,rgba(255,243,222,.08) 1.5px,transparent 2px) 0 0/26px 26px,radial-gradient(ellipse 70% 50% at 80% 0%,#3556D6,#1D3BB8 60%,#142A8C)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px}
.hd small{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.2em;background:#F49AB4;color:#142A8C;padding:5px 11px;border-radius:4px}
.hd h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(36px,5vw,62px);margin-top:14px;line-height:1.05}
.hd h1 em{font-style:normal;color:#F5CF3F;display:block;font-size:.5em;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;border:1.5px solid rgba(255,243,222,.35)}
.chips span.k{background:#F5CF3F;color:#142A8C;border-color:#F5CF3F}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#F5CF3F;color:#142A8C;font-weight:700;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap}
.cta:hover{background:#FFF3DE}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#FFF3DE;padding:10px 10px 4px;border-radius:14px;box-shadow:0 24px 44px -24px rgba(5,10,50,.7)}
figure a{display:block;overflow:hidden;border-radius:8px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#4C5A8C;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:700;color:#142A8C}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0F1F6B;border-top:3px solid #F49AB4;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#D6DDFB}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS AD SET · SD-SN48</small>

   <div class="chips"><span class="k">Christmas pre-order</span><span>English · ₱ prices</span><span>Cobalt, glaze pink &amp; calamansi yellow</span><span>Feed 1:1</span><span>Portrait 4:5</span><span>Story 9:16</span></div>
  </div>

 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="Butas Donut Bar square ad on a cobalt blue background with sparkles. Big cream serif headline 'A dozen for the Noche Buena table', a yellow price circle reading 12 donuts ₱449 per box, flavor chips on the left, 'Mix &amp; match 6 flavors' and an open box of twelve glazed donuts in ube, calamansi, strawberry, chocolate, mango and sugar. A cream strip at the bottom says order by Dec 23 with a DM to reserve button." width="1080" height="1080"></a><figcaption><b>Feed</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="Portrait version with the headline and price circle on top, the open dozen box in the middle and six flavor chips below, ending with the order strip" width="1080" height="1350"></a><figcaption><b>Portrait</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="Story version with a centered headline, 'Mix &amp; match 6 flavors' line, price sticker on the box corner, flavor chips and order details with a yellow DM to reserve button kept inside the safe area" width="1080" height="1920"></a><figcaption><b>Story</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>

</html>
