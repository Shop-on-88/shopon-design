<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#171610;color:#efe4c8;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(900px 520px at 85% -10%,rgba(201,162,74,.20),transparent 65%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);background-size:auto,8px 8px}
.top{height:10px;background:repeating-linear-gradient(90deg,#c9a24a 0 40px,#b8322a 40px 52px)}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Special Elite',monospace;font-size:15px;letter-spacing:.2em;color:#e8c873}
.hd h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(30px,4.2vw,50px);margin-top:8px;line-height:1.25}
.hd h1 em{font-style:normal;color:#e8c873}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;color:#e2dcc6;border:1.5px solid rgba(201,162,74,.45)}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:6px;background:#c9a24a;color:#1d1a14;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap}
.cta:hover{background:#e8c873}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#2a281c;padding:10px;border-radius:8px;border:1px solid rgba(201,162,74,.3);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:4px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#b9b39c;padding:10px 4px 2px}
figcaption b{color:#e8c873;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(23,22,16,.97);border-top:2px solid #c9a24a;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#d8d2bc}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>

</html>
