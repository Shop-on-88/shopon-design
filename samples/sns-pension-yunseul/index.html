<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤슬 펜션 · 겨울 평일 할인 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Montserrat:wght@600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#e4ecef radial-gradient(1200px 600px at 80% -10%,rgba(224,120,58,.14),transparent 60%);color:#17302a;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;letter-spacing:.24em;color:#e0783a}
.hd h1{font-family:'Nanum Myeongjo',serif;font-weight:800;color:#1d3a33;font-size:clamp(28px,4vw,42px);letter-spacing:-.01em;margin-top:8px;line-height:1.25}
.hd h1 em{font-style:normal;color:#e0783a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;background:#fff;border:1px solid #c8d6d8;padding:6px 12px;border-radius:30px;color:#2c5248}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#1d3a33;color:#f8fbfb;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap}
.cta:hover{background:#2c5248}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px;border-radius:14px;border:1px solid #d0dcdd;box-shadow:0 24px 50px -34px rgba(29,58,51,.5)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#5c726c;padding:10px 4px 2px}
figcaption b{color:#17302a;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(29,58,51,.97);border-top:1px solid #2c5248;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#d9e6e1}
.bar .cta{height:46px;background:#e0783a;color:#fff}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SOCIAL AD SET · SD-SN06</small>
   <h1>윤슬 펜션<br><em>겨울 평일 숙박 할인</em></h1>
   <div class="chips"><span>한국어 · 원화 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="윤슬 펜션 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="윤슬 펜션 할인 안내 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="윤슬 펜션 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 이벤트도 이런 광고 세트로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
