<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링위 복싱클럽 · 12월 신규 등록 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#141414}
body{font-family:'Noto Sans KR',sans-serif;color:#EEE6D3;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;
 background:radial-gradient(ellipse 50% 40% at 90% 0%,rgba(194,31,42,.35),transparent 70%),radial-gradient(circle,rgba(238,230,211,.06) 1.6px,transparent 2px) 0 0/14px 14px,linear-gradient(170deg,#1C1B1A,#121212)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px}
.hd small{display:inline-block;font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;letter-spacing:.24em;background:#C21F2A;color:#EEE6D3;padding:6px 12px;transform:rotate(-2deg)}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(40px,5.4vw,66px);margin-top:16px;line-height:1.08}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-weight:500;color:#CFC6B4;font-size:.34em;margin-top:12px}
.hd h1 em b{font-weight:700;color:#F06A6F}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;border:1.5px solid rgba(238,230,211,.3)}
.chips span.k{background:#EEE6D3;color:#141414;border-color:#EEE6D3;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#C21F2A;color:#EEE6D3;font-weight:700;font-size:15px;text-decoration:none;border-radius:4px;transition:.2s;white-space:nowrap}
.cta:hover{background:#EEE6D3;color:#141414}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#EEE6D3;padding:10px 10px 4px;border-radius:6px;box-shadow:0 26px 46px -24px rgba(0,0,0,.9)}
figure a{display:block;overflow:hidden;border-radius:3px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#6B6258;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:700;color:#141414}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0E0E0E;border-top:3px solid #C21F2A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#CFC6B4}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS AD SET · SD-SN54</small>
   <h1>링위 복싱클럽 <em>12월 신규 등록 · 3개월 <b>249,000원</b> + 글러브·핸드랩 증정</em></h1>
   <div class="chips"><span class="k">첫 체험 1회 무료</span><span>한국어 · 원화</span><span>파이트 포스터 · 크림슨 레드 · 잉크 블랙</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="링위 복싱클럽 정사각형 피드 광고. 망점이 깔린 신문지빛 크림 바탕 오른쪽 위에 끈으로 매달린 빨간 복싱 글러브 한 쌍과 흰·빨강·검정 링 로프가 대각선으로 지나갑니다. 왼쪽에는 'ROUND 01 · DEC' 빨간 띠와 '올겨울, 링 위에서 한 판.' 큰 제목, 12월 신규 등록 이벤트 안내가 있고, 아래 검정 티켓 모양 카드에 3개월 249,000원과 빨간 절취선 칸에 글러브+핸드랩 증정 문구, 맨 아래 자리표시 전화번호와 카카오톡 ID가 있습니다." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로형 광고. 어두운 체육관에 위에서 내리쬐는 조명 아래 체인에 매달린 검정 샌드백(빨간 띠, 세로 글자 '링위')과 링 로프, 바닥에 말린 흰 핸드랩이 있습니다. 왼쪽에 'DEC · NEW MEMBERS' 띠와 '샌드백 첫 펀치는 12월에.' 제목, 코치가 1:1로 자세를 잡아 준다는 안내, 아래 크림색 티켓 카드에 3개월 249,000원과 글러브+핸드랩 증정, 연락처가 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리형 광고. 크림슨 레드 바탕 위쪽에 금빛 링 공(벨)이 울리는 선과 함께 그려져 있고 가운데 '12월 · ROUND 01'과 '공이 울리면 시작입니다' 큰 제목, 아래쪽에서 빨간 글러브 두 개가 솟아오르며, 검정 티켓 카드에 3개월 249,000원과 글러브+핸드랩 증정, 크림색 '무료 체험 예약하기' 버튼과 연락처가 안전 영역 안에 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게도 이런 광고 이미지가 필요하다면</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
