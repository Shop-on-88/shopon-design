<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물풀집 · 수초 어항 세팅 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#EEEAE0}
body{word-break:keep-all;font-family:'Noto Sans KR',sans-serif;color:#1D3127;background:#EEEAE0;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:2px solid #1D3127}
.hd small{font-size:14px;font-weight:600;color:#46564C;font-family:'Noto Sans KR',sans-serif}
.hd h1{font-family:'Gowun Batang',serif;font-size:clamp(34px,4.8vw,58px);font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:8px}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:.42em;font-weight:500;color:#46564C;margin-top:12px;letter-spacing:0}
.hd h1 em b{color:#B3352C;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#46564C}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:10px;height:10px;border-radius:2px;background:#3F6B47}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#1D3127;color:#fff;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px;transition:background .2s;white-space:nowrap}
.cta:hover{background:#3F6B47}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#F7F5EF;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(29,49,39,.16);box-shadow:0 24px 40px -28px rgba(29,49,39,.6)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#46564C;padding:12px 4px}
figcaption b{color:#1D3127;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1D3127;border-top:3px solid #3F6B47;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#C9D2C9}
.bar .cta{height:48px;background:#F3F0E8;color:#1D3127}
.bar .cta:hover{background:#C9D9C6}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS 광고 세트 · SD-SN57</small>
   <h1>물풀집 <em>동네 수족관의 30cm 수초 어항 세팅 패키지 · <b>189,000원</b></em></h1>
   <div class="facts"><span>한국어 · 원화</span><span>종이 크림 · 수초 그린 · 네온테트라 레드</span><span>피드 1:1 · 세로 4:5 · 스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="정사각형 피드 광고. 크림색 바탕 위쪽에 물풀집 로고와 '책상 위에 둘 30cm 수초 어항, 물 잡아서 가져다 드립니다' 제목, 가게에서 2주 동안 물을 잡고 수초가 자리 잡은 뒤에 옮긴다는 설명이 있습니다. 오른쪽 아래 나무 책상 위에는 조명이 달린 유리 어항이 있고, 안에 유목과 고사리, 키 큰 수초와 붉은 수초, 바닥의 잔디 수초, 네온테트라 떼가 그려져 있습니다. 왼쪽에 빨간 189,000원과 어항·조명·여과기, 수초 6종, 유목·돌, 네온테트라 10마리 구성표, 맨 아래 자리표시 연락처가 있습니다." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 광고. 위쪽에 '2주 동안 물을 잡아 둔 30cm 수초 어항' 제목과 세팅부터 첫 물갈이까지 가게에서 해 두고 수초가 뿌리내린 상태로 옮겨 준다는 설명이 있고, 가운데 나무 책상 위에 큰 수초 어항이 놓여 있으며 책상에 가로 30cm · 18리터 치수 표시가 있습니다. 아래쪽에 세팅 패키지 · 배송 포함 189,000원과 구성품 네 가지가 있습니다." width="1080" height="1350"></a><figcaption><b>세로</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리 광고. '물 잡힌 수초 어항을 책상까지 옮겨 드립니다' 제목과 가로 30cm · 18리터 · 네온테트라 10마리 안내 아래 책상 위 수초 어항이 크게 있고, 그 밑에 1주차 세팅, 2주차 물 잡기, 3주차 배송 세 단계 설명, 빨간 189,000원 배송 포함, 진한 초록 '메시지로 날짜 잡기' 버튼과 자리표시 연락처가 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게도 이런 광고 이미지가 필요하다면</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
