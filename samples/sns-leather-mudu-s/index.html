<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

.chips span.k{background:#241c17;color:#efd9a6;border:1.5px solid #241c17;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:#6e1e2a;color:#f6ead4;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 0 0 2px #6e1e2a,inset 0 0 0 2px rgba(0,0,0,.2),0 0 0 4px rgba(246,234,212,.0);outline:2px dashed rgba(246,234,212,.55);outline-offset:-7px}
.cta:hover{background:#54141f}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#2a221d;padding:10px;border-radius:14px;box-shadow:0 18px 40px -18px rgba(60,30,10,.55),0 0 0 1px #1a1411;position:relative}
figure::before{content:'';position:absolute;inset:4px;border:1.5px dashed rgba(217,180,104,.45);border-radius:11px;pointer-events:none}
figure a{display:block;position:relative}
figure img{display:block;width:100%;height:auto;border-radius:6px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#c9b89c;padding:10px 4px 2px;font-weight:500}
figcaption b{font-weight:700;color:#e6c97f}
.bar{position:fixed;left:0;right:0;bottom:0;background:#241c17;border-top:3px solid #6e1e2a;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e6d8c0}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:36px 16px 120px}.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
