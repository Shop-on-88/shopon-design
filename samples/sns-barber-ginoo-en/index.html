<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#22324a;color:#f0e9db;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(900px 500px at 100% -10%,rgba(229,72,47,.22),transparent 60%)}
.top{height:12px;background:repeating-linear-gradient(135deg,#e5482f 0 14px,#f0e9db 14px 28px,#2f4259 28px 42px,#f0e9db 42px 56px)}
.wrap{max-width:1200px;margin:0 auto;padding:40px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-size:13px;font-weight:700;letter-spacing:.24em;color:#e9b949}
.hd h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(30px,4.2vw,46px);margin-top:10px;line-height:1.15}
.hd h1 em{font-style:normal;color:#e5482f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;border:1.5px solid rgba(240,233,219,.35);padding:6px 12px;border-radius:3px;color:#d9d2c3}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:4px;background:#e5482f;color:#f0e9db;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 5px 0 #121820}
.cta:hover{transform:translateY(-2px);box-shadow:0 7px 0 #121820}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#2f4259;padding:10px;border-radius:8px;border:1px solid rgba(240,233,219,.16);box-shadow:0 24px 50px -28px rgba(0,0,0,.8)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:4px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#bfc6cf;padding:10px 4px 2px}
figcaption b{color:#f0e9db;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,24,32,.96);border-top:2px solid #e5482f;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#d9d2c3}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>

  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">Get this design <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">

  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="Ginoo Barbers price list portrait post 4:5" width="1080" height="1350"></a><figcaption><b>Portrait</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="Ginoo Barbers story ad 9:16" width="1080" height="1920"></a><figcaption><b>Story</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>Want a set like this for your shop's next promo?</p><a class="cta" href="https://design.shoponph.online/#inquiry">Get this design</a></div>

</html>
