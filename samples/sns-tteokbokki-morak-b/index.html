<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f7efda;color:#2a1d16;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:linear-gradient(90deg,transparent 0 62px,rgba(224,122,108,.45) 62px 64px,transparent 64px),repeating-linear-gradient(0deg,transparent 0 41px,rgba(169,195,214,.45) 41px 43px)}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px;background:#2c4536;color:#f4ecd6;padding:30px 32px;border-radius:14px;border:12px solid #7a4b28;box-shadow:0 22px 40px -24px rgba(42,29,22,.7)}
.hd small{font-family:'Do Hyeon',sans-serif;font-size:16px;letter-spacing:.12em;color:#f2cf4e}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(30px,4.2vw,46px);margin-top:10px;line-height:1.25}
.hd h1 em{font-style:normal;color:#ff8a6b}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;border:1.5px dashed rgba(244,236,214,.55);padding:6px 12px;border-radius:30px;color:#f4ecd6}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#c8321f;color:#fff;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap}
.cta:hover{background:#a8270f}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fffaf0;padding:10px;border-radius:6px;box-shadow:0 24px 50px -30px rgba(42,29,22,.6);position:relative}
figure:before{content:"";position:absolute;left:50%;top:-12px;width:96px;height:26px;margin-left:-48px;background:rgba(242,207,78,.8);transform:rotate(-3deg)}
figure:nth-child(2):before{transform:rotate(4deg)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:3px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#6e5a4a;padding:10px 4px 2px}
figcaption b{color:#c8321f;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(31,50,39,.97);padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#f4ecd6}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto;width:100%}}
@media(max-width:620px){body{background-image:repeating-linear-gradient(0deg,transparent 0 41px,rgba(169,195,214,.45) 41px 43px)}.hd{padding:22px 20px;border-width:8px}.grid{grid-template-columns:1fr;gap:30px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>

  </div>

  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="모락 떡볶이 세트 구성 세로 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>

</html>
