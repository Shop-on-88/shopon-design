<!DOCTYPE html>
<html lang="ko">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;background:#f4ecd8;color:#1b1a17;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.top{height:22px;background:repeating-linear-gradient(90deg,#e0533a 0 22px,#f0b429 22px 44px,#4a90c8 44px 66px,#9b7bc8 66px 88px,#fbf3df 88px 110px);border-bottom:4px solid #1b1a17}
.wrap{max-width:1200px;margin:0 auto;padding:48px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{display:block;font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;letter-spacing:.2em;color:#1f5a45}
.hd .en{font-family:'Outfit';font-weight:800;font-size:16px;color:#e0533a;letter-spacing:.12em;margin-top:6px}
.hd h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(32px,4.6vw,56px);margin-top:4px;line-height:1.15}
.hd h1 em{font-style:normal;color:#1f5a45;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;background:#fffaf0;border:2px solid #1b1a17}
.chips span.k{background:#1f5a45;color:#fbf3df}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:14px;background:#e0533a;color:#fff;font-weight:900;font-size:15px;text-decoration:none;border:3px solid #1b1a17;box-shadow:5px 5px 0 #1b1a17;transition:.2s;white-space:nowrap}
.cta:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 #1b1a17}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#1f5a45;padding:10px;border-radius:18px;border:3px solid #1b1a17;box-shadow:6px 6px 0 #1b1a17}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:10px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#cfe2d6;padding:10px 4px 2px;font-weight:500}
figcaption b{font-weight:900;color:#f0b429}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1b1a17;border-top:4px solid #f0b429;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#efe5cc}
.bar .cta{height:46px;box-shadow:none;border-color:#fbf3df}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:36px 16px 120px}.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>

</html>
