<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새김도장방 · 새해 손도장 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E9E1D2}
body{word-break:keep-all;font-family:'Noto Sans KR',sans-serif;color:#22201C;background:#E9E1D2;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:2px solid #22201C}
.hd small{font-size:14px;font-weight:500;color:#5B544A}
.hd h1{font-family:'Song Myung',serif;font-size:clamp(36px,5vw,60px);font-weight:400;letter-spacing:-.01em;line-height:1.1;margin-top:8px}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:.42em;font-weight:500;color:#5B544A;margin-top:12px;letter-spacing:0}
.hd h1 em b{color:#B0301B;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#5B544A}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:10px;height:10px;border-radius:2px;background:#B0301B}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#22201C;color:#fff;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px;transition:background .2s;white-space:nowrap}
.cta:hover{background:#4A443B}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#F7F2E8;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(34,32,28,.16);box-shadow:0 24px 40px -28px rgba(34,32,28,.6)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#5B544A;padding:12px 4px}
figcaption b{color:#22201C;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#22201C;border-top:3px solid #C2361F;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#CFC6B5}
.bar .cta{height:48px;background:#C2361F;color:#FFF8EE}
.bar .cta:hover{background:#A82C17}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">

   <div class="facts"><span>한국어 · 원화</span><span>한지 아이보리 · 먹 · 인주 주홍</span><span>피드 1:1 · 세로 4:5 · 스토리 9:16</span></div>
  </div>

 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="정사각형 피드 광고. 결이 보이는 한지 아이보리 바탕 위쪽에 새김도장방 로고와 '새해 도장은 손으로 새깁니다' 명조 제목, 이름을 듣고 글씨를 앉힌 뒤 조각칼로 한 획씩 파고 다음 날 찾아간다는 설명이 있습니다. 오른쪽에는 '새김도장' 네 글자가 들어간 붉은 사각 인영이 살짝 기울어 크게 찍혀 있고, 가장자리가 인주 번짐처럼 거칩니다. 아래에 회양목 인감도장 손각인 주홍색 25,000원과 12월 한 달 인주함 함께 드린다는 문구가 있습니다." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 광고. '나무를 고르고, 이름을 새깁니다' 제목 아래 인감 · 통장 · 회사 도장 모두 손으로 판다는 설명이 있고, 결이 보이는 노란 회양목, 짙은 흑단, 검은 물소뿔 도장 세 개가 나란히 서 있습니다. 각각 아래에 이름과 짧은 설명, 25,000원 · 48,000원 · 68,000원 가격이 있고, 맨 아래에 12월 주문 시 인주함을 함께 준다는 문구와 자리표시 전화번호가 있습니다." width="1080" height="1350"></a><figcaption><b>세로</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리 광고. '도장 밑면, 한 획씩 팝니다' 제목 아래 돋보기 렌즈 속에 회양목 도장 밑면이 크게 보이고, '새김도장' 글자가 좌우 반전된 채 도드라지게 새겨져 있습니다. 아래에 1 이름과 글씨체 고르기, 2 조각칼로 새기기, 3 찍어 보고 받기 세 단계와 회양목 인감도장 25,000원, 12월 인주함 함께, 자리표시 전화번호가 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게도 이런 광고 이미지가 필요하다면</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
