<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0b1630;color:#f4f7fb;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;

.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}

.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(32px,4.4vw,52px);margin-top:8px;line-height:1.18}
.hd h1 em{font-style:normal;color:#c6ff3d}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;background:rgba(244,247,251,.06);padding:6px 12px;border-radius:6px;color:#d6e2f3;border:1px solid rgba(127,184,255,.3)}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:10px;background:#c6ff3d;color:#0b1630;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 5px 0 #7fa61f}
.cta:hover{transform:translateY(2px);box-shadow:0 3px 0 #7fa61f}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#13244a;padding:10px;border-radius:14px;border:1px solid rgba(127,184,255,.25);box-shadow:0 26px 50px -24px rgba(0,0,0,.7)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:6px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#a9bddc;padding:10px 4px 2px}
figcaption b{color:#c6ff3d;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(8,16,34,.97);border-top:2px solid #c6ff3d;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#d6e2f3}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
