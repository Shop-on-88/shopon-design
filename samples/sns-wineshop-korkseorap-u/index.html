<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코르크서랍 와인숍 · 크리스마스 와인 3병 세트 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@400;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;color:#F4ECDD;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(ellipse 60% 40% at 50% 0%,#2A3D72,transparent 70%),linear-gradient(180deg,#0E1630,#16224A)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px;padding-bottom:30px;border-bottom:1px solid rgba(217,185,108,.35)}
.hd small{display:block;font-family:'Outfit',sans-serif;font-weight:600;font-size:13px;letter-spacing:.32em;color:#D9B96C}
.hd .it{font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:#D9B96C;margin-top:12px}
.hd h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(32px,4.4vw,52px);margin-top:4px;line-height:1.22}
.hd h1 em{font-style:normal;color:#F3DE9F;display:block;font-size:.6em;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:6px;background:rgba(244,236,221,.07);border:1px solid rgba(244,236,221,.25);color:#E7E2D6}
.chips span.k{background:#D9B96C;border-color:#D9B96C;color:#121C36;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 28px;border-radius:40px;background:linear-gradient(135deg,#F3DE9F,#C9A456);color:#121C36;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 10px 26px rgba(217,185,108,.25)}
.cta:hover{transform:translateY(-2px)}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:rgba(244,236,221,.05);padding:10px 10px 4px;border:1px solid rgba(217,185,108,.45);border-radius:8px}
figure a{display:block;border-radius:4px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#AEB5C9;padding:10px 2px 6px;font-family:'Outfit',sans-serif;letter-spacing:.06em}
figcaption b{font-family:'Noto Sans KR',sans-serif;font-weight:700;color:#F3DE9F;letter-spacing:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,18,40,.95);backdrop-filter:blur(6px);border-top:1px solid #D9B96C;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#C9CFE0}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:28px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">

   <div class="chips"><span class="k">레드 · 화이트 · 스파클링</span><span>12월 예약 판매</span><span>미드나잇 네이비 & 샴페인 골드</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>

 </div>

  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="코르크서랍 피드 광고, 별이 뜬 남색 밤하늘 바탕에 리본을 두른 나무 상자 속 레드·스파클링·화이트 와인 세 병, 오른쪽에 크리스마스 와인 3병 세트와 89,000원, 아래 판매 기간·손글씨 카드·하루 한정 안내 3칸, 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="코르크서랍 세로 광고, 위에 Merry little evening과 크리스마스 와인 3병 세트 제목, 가운데 와인 세 병이 든 나무 상자, 아래 89,000원과 안내 칩 3개, 4:5" width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="코르크서랍 스토리 광고, 큰 제목 크리스마스 와인 3병 세트, 와인 상자 그림, 89,000원과 낱병 합계 안내, 카카오톡으로 예약하기 버튼, 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>

</body>
</html>
