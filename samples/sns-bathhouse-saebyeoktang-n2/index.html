<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새벽탕 · 12월 세신 예약 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E9F1F2}
body{word-break:keep-all;font-family:'Noto Sans KR',sans-serif;color:#1D2F45;background:#E9F1F2;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:2px solid #1D2F45}
.hd small{font-size:14px;font-weight:500;color:#4A5D72}
.hd h1{font-family:'Do Hyeon',sans-serif;font-size:clamp(44px,6vw,72px);font-weight:400;line-height:1.04;letter-spacing:-.01em;margin-top:8px}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:clamp(16px,1.6vw,19px);font-weight:400;letter-spacing:0;color:#33475D;margin-top:16px;line-height:1.6;max-width:720px}
.hd h1 em b{color:#C9351F;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#4A5D72}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:8px;height:8px;border-radius:2px;background:#7FB2C3}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#1D2F45;color:#F3F7F7;font-weight:700;font-size:16px;text-decoration:none;border-radius:8px;transition:background-color .2s;white-space:nowrap}
.cta:hover{background:#2C4360}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr .8fr .6fr;gap:24px;align-items:start}
figure{background:#FBFCFA;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(29,47,69,.14);box-shadow:0 16px 32px -24px rgba(29,47,69,.5)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#4A5D72;padding:12px 4px}
figcaption b{color:#1D2F45;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1D2F45;border-top:3px solid #7FB2C3;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#C3D4DC}
.bar .cta{height:48px;background:#F3F7F7;color:#1D2F45}
.bar .cta:hover{background:#DCE7EA}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:first-child{grid-column:span 2}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:first-child{grid-column:auto}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS 광고 이미지 · SD-SN64</small>
   <h1>새벽탕 <em>새벽 5시에 문을 여는 동네 대중목욕탕의 12월 평일 광고. 세신을 전화로 예약하면 <b>입욕료를 받지 않고</b>, 세신은 40분 25,000원</em></h1>
   <div class="facts"><span>한국어 · 원화</span><span>목욕탕 타일 하늘색 · 남색 · 온천 표시 빨강</span><span>피드 1:1 · 세로 4:5 · 스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="정사각형 피드 광고. 하늘색 작은 타일 벽에 나사로 고정한 흰 법랑 안내판이 위쪽을 가로지르고, 빨간 온천 표시와 새벽탕 이름, 동네 목욕탕 1986년부터라는 글씨 아래 12월 평일 월요일부터 금요일까지, 큰 글씨로 세신 예약하시면, 그 아래 빨간 글씨로 입욕료는 받지 않습니다가 있습니다. 왼쪽 아래에는 남색 머리띠가 달린 요금표 판에 세신 40분 때수건 새것 25,000원(빨강), 입욕료 평소 9,000원에서 0원, 예약 000-0000-0000과 영업 05:00–20:00이 적혀 있습니다. 오른쪽 아래 타일 선반 위에는 노란 플라스틱 바가지 네 개가 아래로 갈수록 테두리가 조금씩 넓어지며 포개져 있고, 맨 위 바가지에 가운데가 둥글게 솟고 양옆에 돌돌 만 귀가 달린 양머리 수건이 올라가 있으며, 초록 때수건이 맨 위 바가지 테두리에 걸쳐 늘어져 있습니다. 수건 위로 옅은 김이 세 줄기 피어오르고 타일 벽에는 물방울이 맺혀 있습니다." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 광고. 위쪽 흰 타일 벽에 새벽탕 이름과 큰 글씨 새벽 5시, 온탕은 42도로 데워 둡니다, 문 열기 한 시간 전부터 물을 받아 두어 첫 손님도 데워진 탕에 들어간다는 설명이 있습니다. 오른쪽에는 남색 법랑판에 온탕이라는 글씨와 20·40·60 눈금이 있는 둥근 바늘 온도계, 큰 글씨 42℃가 붙어 있습니다. 남색 띠 아래는 하늘색 타일 벽과 온탕 단면 그림으로, 벽에서 나온 은색 수도꼭지가 뜨거운 물을 붓고, 위는 옅고 아래로 갈수록 깊어지는 청록색 물속에 기포와 물결 빛이 보이며, 물 위에 안쪽 벽과 짙은 바닥이 들여다보이는 노란 바가지 하나가 물결 고리를 만들며 떠 있고 수면 위로 김이 오릅니다. 아래 흰 안내판에 12월 평일 월–금, 세신 예약 시 입욕료 무료(입욕료 무료만 빨강), 예약 000-0000-0000 · 05:00–20:00, 오른쪽에 세신 40분 25,000원이 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리 광고. 하늘색 타일 벽 왼쪽에 아주 큰 글씨 세신 자리, 시간 맞춰 비워 둡니다, 그 아래 열쇠 받고 탕에서 몸을 데우면 예약한 시간에 세신 자리로 부른다는 설명이 있습니다. 오른쪽에는 벽 고리에 파란 꼬임 고무줄 고리가 걸려 있고, 그 고리가 신발장 17번 흰 번호표의 구멍을 꿰고 지나가며 같은 고리에 금빛 열쇠도 끼워져 있습니다. 가운데 남색 법랑판에는 온천 표시와 새벽탕의 하루라는 제목, 설·추석 당일만 쉰다는 안내, 05:00 문 엽니다(온탕 42℃, 열탕 45℃, 냉탕 18℃), 05:30 세신 첫 예약(이후 50분 간격, 마지막 18:20), 19:00 마지막 입장과 20:00 마감이 시간표로 적혀 있습니다. 아래 흰 안내판에 12월 평일 월요일부터 금요일까지, 세신 예약하시면 입욕료는 받지 않습니다(뒷줄 빨강), 예약 000-0000-0000, 세신 40분 25,000원이 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>

</body>
</html>
