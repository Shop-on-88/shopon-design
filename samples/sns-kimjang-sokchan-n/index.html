<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#efe5d1;color:#2b1d14;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(900px 520px at 92% -10%,rgba(181,48,29,.14),transparent 62%),radial-gradient(700px 400px at 0% 100%,rgba(78,122,58,.12),transparent 60%)}
.top{height:14px;background:repeating-linear-gradient(90deg,#b5301d 0 40px,#4e7a3a 40px 52px,#f3ead8 52px 58px)}
.wrap{max-width:1200px;margin:0 auto;padding:34px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;letter-spacing:.22em;color:#4e7a3a}
.hd h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(30px,4.2vw,50px);margin-top:8px;line-height:1.25}
.hd h1 em{font-style:normal;color:#b5301d}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:#f8f2e6;color:#4a3626;border:1.5px solid rgba(43,29,20,.2)}
.chips span.k{background:#b5301d;color:#fbefe0;border-color:#b5301d;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:#b5301d;color:#fbefe0;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap}
.cta:hover{background:#2b1d14}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fbf7ee;padding:10px;border-radius:16px;box-shadow:0 24px 50px -24px rgba(58,36,22,.45);border:1px solid rgba(43,29,20,.1)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#6b5644;padding:10px 4px 2px;font-weight:500}
figcaption b{font-weight:700;color:#2b1d14}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2b1d14;border-top:3px solid #b5301d;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e2d5bb}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}.hd h1 em{display:block}}
</style>
</head>
