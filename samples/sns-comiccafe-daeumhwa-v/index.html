<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다음화 만화카페 · 겨울 심야 패키지 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;color:#141414;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(circle,rgba(20,20,20,.13) 1.3px,transparent 1.6px) 0 0/10px 10px,#F5F1E8}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px;background:#F5F1E8;border:5px solid #141414;padding:26px 28px;box-shadow:10px 10px 0 #FF7A1A}
.hd small{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.2em;background:#141414;color:#F5F1E8;padding:5px 11px}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(32px,4.4vw,54px);margin-top:12px;line-height:1.15}
.hd h1 em{font-style:normal;color:#FF7A1A;display:block;font-size:.62em;margin-top:4px;-webkit-text-stroke:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chips span{font-size:13px;font-weight:700;padding:6px 13px;border-radius:30px;background:#fff;border:3px solid #141414}
.chips span.k{background:#FFD23F}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#FF7A1A;color:#141414;font-weight:700;font-size:15px;text-decoration:none;transition:.15s;white-space:nowrap;border:4px solid #141414;box-shadow:5px 5px 0 #141414}
.cta:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #141414}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px 10px 4px;border:4px solid #141414}
figure:nth-child(2){transform:rotate(.6deg)}
figure a{display:block;overflow:hidden;border:2px solid #141414}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#444;padding:10px 2px 6px;font-weight:500}
figcaption b{font-weight:700;color:#141414}
.bar{position:fixed;left:0;right:0;bottom:0;background:#141414;border-top:4px solid #FF7A1A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#E9E4D8}
.bar .cta{height:46px;box-shadow:none;border-color:#FF7A1A}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.hd{padding:20px 18px;box-shadow:6px 6px 0 #FF7A1A}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}figure:nth-child(2){transform:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS AD SET · SD-SN46</small>
   <h1>다음화 만화카페 <em>겨울 심야 패키지 6시간 + 라면 14,000원</em></h1>
   <div class="chips"><span class="k">만화 칸 나누기 구성</span><span>12월 – 2월 한정</span><span>잉크 블랙 & 스크린톤 & 담요 탠저린</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="다음화 만화카페 피드 광고, 만화책 칸처럼 나뉜 화면에 다락 칸에서 담요를 덮고 엎드려 만화를 읽는 사람과 컵라면 그림, 오른쪽 집중선 위 겨울 심야 패키지 제목, 아래 밤 10시부터 새벽 4시, 노란 폭발 말풍선 속 14,000원, 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="다음화 만화카페 세로 광고, 위 집중선 칸에 겨울 심야 패키지 제목, 가운데 큰 칸에 만화 읽는 사람과 한 권만 더 말풍선, 아래 입실·퇴실 시간 칸과 검은 칸 속 14,000원, 4:5" width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="다음화 만화카페 스토리 광고, 세 칸 구성으로 제목, 만화 읽는 장면, 시간과 14,000원 가격, 자리 예약은 DM으로 안내, 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 광고 이미지도 이렇게 만들고 싶다면</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
