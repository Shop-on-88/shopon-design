<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바람결 여행 · 세부 겨울방학 가족 패키지 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#2c0f2a;color:#f8ecd2;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(900px 520px at 100% -8%,rgba(247,185,40,.22),transparent 62%),radial-gradient(700px 420px at -10% 30%,rgba(228,85,59,.14),transparent 60%)}
.top{height:14px;background:repeating-linear-gradient(90deg,#f7b928 0 60px,#ee7b2f 60px 90px,#e4553b 90px 110px,#3a1537 110px 124px)}
.wrap{max-width:1200px;margin:0 auto;padding:42px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;letter-spacing:.26em;color:#f7b928}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(30px,4.2vw,46px);margin-top:10px;line-height:1.2}
.hd h1 em{font-style:normal;color:#f7b928}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;border:1.5px solid rgba(248,236,210,.3);padding:6px 12px;border-radius:999px;color:#e9dcc2}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 28px;border-radius:999px;background:#f7b928;color:#3a1537;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 5px 0 #e4553b}
.cta:hover{transform:translateY(-2px);box-shadow:0 7px 0 #e4553b}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#3a1537;padding:10px;border-radius:14px;border:1px solid rgba(248,236,210,.14);box-shadow:0 24px 50px -28px rgba(0,0,0,.85)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#cdbda6;padding:10px 4px 2px}
figcaption b{color:#f8ecd2;font-weight:700}
.note{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.note div{background:rgba(248,236,210,.06);border:1px solid rgba(248,236,210,.12);border-radius:12px;padding:18px 20px}
.note b{display:block;font-family:'Black Han Sans';font-weight:400;font-size:19px;color:#f7b928;margin-bottom:6px}
.note p{font-size:14px;line-height:1.7;color:#e9dcc2}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(36,11,34,.96);border-top:2px solid #f7b928;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e9dcc2}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}.note{grid-template-columns:1fr}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS AD SET · SD-SN13</small>
   <h1>바람결 여행<br><em>세부 겨울방학 가족 패키지</em></h1>
   <div class="chips"><span>여행사</span><span>원화 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="바람결 여행 세부 가족 패키지 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="바람결 여행 일정 소개 세로 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="바람결 여행 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
 <div class="note">
  <div><b>피드 · 한눈에 가격</b><p>둥근 창 속 노을 섬 그림과 1인 기준 가격, 포함 내역을 한 장에.</p></div>
  <div><b>세로 · 5일 일정표</b><p>노을 하늘 포스터 아래에 DAY 1~5 일정을 줄 세워 보여 줍니다.</p></div>
  <div><b>스토리 · 비행기 창</b><p>비행기 창밖 풍경과 탑승권 모양 가격 카드, 문의 버튼까지.</p></div>
 </div>
</div>
<div class="bar"><p>우리 여행 상품도 이런 광고 세트로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
