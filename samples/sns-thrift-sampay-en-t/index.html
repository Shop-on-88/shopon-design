<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;background:#f4efe2;color:#123a6b;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background-image:radial-gradient(circle,rgba(255,74,165,.22) 1.2px,transparent 1.5px);background-size:7px 7px}
.line{position:relative;height:46px;overflow:hidden}
.line svg{position:absolute;left:0;top:0;width:100%;height:46px}
.wrap{max-width:1200px;margin:0 auto;padding:30px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{display:block;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;color:#ff4aa5}
.hd .en{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:80%;font-size:18px;color:#0098a3;letter-spacing:.08em;margin-top:6px}
.hd h1{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:clamp(30px,4.4vw,52px);margin-top:6px;line-height:1.2;color:#0098a3;text-shadow:3px 2px 0 rgba(255,74,165,.75)}
.hd h1 em{font-style:normal;color:#123a6b;display:block;text-shadow:none;font-size:.62em;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#f4efe2;border:2px solid #0098a3;color:#0098a3}
.chips span.k{background:#ff4aa5;border-color:#ff4aa5;color:#fff}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:#0098a3;color:#fff;font-weight:900;font-size:15px;text-decoration:none;box-shadow:4px 3px 0 #ff4aa5;transition:.2s;white-space:nowrap}
.cta:hover{transform:translate(-1px,-1px);box-shadow:6px 5px 0 #ff4aa5}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fffaf0;padding:10px 10px 4px;border:2px solid #0098a3;box-shadow:5px 4px 0 rgba(255,74,165,.8);position:relative}
figure::before{content:"";position:absolute;left:50%;top:-14px;width:12px;height:26px;margin-left:-6px;border-radius:3px;background:#ff4aa5;mix-blend-mode:multiply}
figure a{display:block}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#0098a3;padding:9px 2px 6px;font-weight:700;font-family:'Space Mono',monospace}
figcaption b{font-family:'Noto Sans KR',sans-serif;font-weight:900;color:#ff4aa5}
.bar{position:fixed;left:0;right:0;bottom:0;background:#123a6b;border-top:4px solid #ff4aa5;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e6f2f1}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:24px 16px 120px}.grid{grid-template-columns:1fr;gap:34px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
