*{box-sizing:border-box;margin:0;padding:0}

.hd h1 em{font-style:normal;color:#ffc23d}

.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:linear-gradient(160deg,#ffd36b,#f0a21c);color:#1b120a;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 10px 28px rgba(240,162,28,.25)}
.cta:hover{transform:translateY(-2px);filter:brightness(1.06)}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:linear-gradient(180deg,#c9a06a,#a77845);padding:10px;border-radius:18px;box-shadow:0 24px 50px rgba(0,0,0,.5)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:10px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#3a2412;padding:10px 4px 2px;font-weight:500}
figcaption b{font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0b0a;border-top:3px solid #f0a21c;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e2d5bb}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}.hd h1 em{display:block}}
