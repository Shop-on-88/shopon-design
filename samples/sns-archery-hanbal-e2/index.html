<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#EFE6CF}
body{font-family:'Noto Sans KR',sans-serif;color:#1F2621;background:#EFE6CF;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:2px solid #1F2621}
.hd small{font-size:14px;font-weight:700;color:#535E3B}
.hd h1{font-size:clamp(32px,4.6vw,56px);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:8px}
.hd h1 em{display:block;font-style:normal;font-size:.4em;font-weight:500;color:#46503F;margin-top:12px}
.hd h1 em b{color:#D6402E;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#46503F}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:8px;height:8px;border-radius:50%;background:#F2C230;box-shadow:0 0 0 2px #1F2621}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#1F2621;color:#F2C230;font-weight:700;font-size:16px;text-decoration:none;border-radius:8px;transition:background .2s,color .2s;white-space:nowrap}
.cta:hover{background:#D6402E;color:#fff}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#F7F3E8;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(31,38,33,.18);box-shadow:0 24px 40px -28px rgba(31,38,33,.6)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#46503F;padding:12px 4px}
figcaption b{color:#1F2621}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1F2621;border-top:3px solid #F2C230;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#C9C3AE}
.bar .cta{height:48px;background:#F2C230;color:#1F2621}
.bar .cta:hover{background:#fff}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>

  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로형 광고. 어두운 실내 사로에서 활을 든 사람의 눈높이로 본 장면으로, 왼쪽 앞에 활과 노란 깃 화살이 걸려 있고 나무 바닥 레인에 3m·5m·8m 거리 표시가 이어지며 끝에 조명을 받은 과녁이 서 있습니다. 위쪽에 '10미터 앞 과녁, 둘이서 60발' 제목과 코치가 첫 10분 자세를 잡아 준다는 안내, 오른쪽 아래 크림·노랑 티켓 칸에 29,000원과 기간, 연락처가 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>

 </div>
</div>
