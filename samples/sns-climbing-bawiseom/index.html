<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#2b2d31;color:#f4f1ea;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(circle,rgba(0,0,0,.35) 2.5px,transparent 3px),radial-gradient(900px 500px at 90% -10%,rgba(198,240,74,.14),transparent 65%);background-size:44px 44px,auto}
.top{height:16px;background:repeating-linear-gradient(90deg,#ff5a3c 0 60px,#2f5bea 60px 120px,#c6f04a 120px 180px,#8e5cf0 180px 240px,#ffc531 240px 300px)}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.2em;color:#c6f04a}
.hd h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(34px,4.6vw,54px);margin-top:8px;line-height:1.15}
.hd h1 em{font-style:normal;color:#ff5a3c}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;background:#3b3e43;padding:6px 12px;border-radius:6px;color:#dcdde0;border-left:3px solid #c6f04a}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#ff5a3c;color:#fff;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 5px 0 #a8301c}
.cta:hover{transform:translateY(2px);box-shadow:0 3px 0 #a8301c}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#f4f1ea;padding:10px;border-radius:12px;box-shadow:0 26px 50px -24px rgba(0,0,0,.7)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:6px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#5d6066;padding:10px 4px 2px}
figcaption b{color:#24262a;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(36,38,42,.97);border-top:3px solid #c6f04a;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#dcdde0}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
 <div class="hd">

   <div class="chips"><span>볼더링장 연말 이벤트</span><span>원화 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="바위섬 클라이밍 친구 동반 1일권 1+1 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="바위섬 클라이밍 체험 포함 항목 세로 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="바위섬 클라이밍 홀드 벽 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>

</html>
