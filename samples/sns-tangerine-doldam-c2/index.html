<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#1D1E22}
body{font-family:'Noto Sans KR',sans-serif;color:#F4ECE0;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:
  radial-gradient(circle at 12% 18%,rgba(10,10,12,.55) 0 2px,transparent 3px),
  radial-gradient(circle at 64% 72%,rgba(10,10,12,.45) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 38% 44%,rgba(10,10,12,.5) 0 2.5px,transparent 3.5px),
  radial-gradient(circle at 86% 30%,rgba(10,10,12,.45) 0 1.5px,transparent 2.5px),
  radial-gradient(ellipse 55% 40% at 82% 6%,rgba(255,138,31,.2),transparent 70%),
  radial-gradient(ellipse 50% 40% at 6% 96%,rgba(31,74,53,.55),transparent 70%),
  linear-gradient(170deg,#2B2D32,#202125 55%,#18191C);
 background-size:140px 140px,110px 110px,190px 190px,90px 90px,auto,auto,auto}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px}
.hd small{display:inline-block;font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;letter-spacing:.2em;background:#FF8A1F;color:#1E1408;padding:5px 11px;border-radius:4px}
.hd h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(36px,5vw,62px);margin-top:14px;line-height:1.1;letter-spacing:-.02em}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-weight:500;color:#C9D6DF;font-size:.38em;margin-top:12px;letter-spacing:0}
.hd h1 em b{font-weight:900;color:#FF9A3A}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;border:1.5px solid rgba(244,236,224,.3)}
.chips span.k{background:#1F4A35;color:#FBF4E6;border-color:#2E6B47;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#FF8A1F;color:#1E1408;font-weight:700;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap}
.cta:hover{background:#FBF4E6}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#FBF4E6;padding:10px 10px 4px;border-radius:14px;box-shadow:0 26px 46px -24px rgba(0,0,0,.85)}
figure a{display:block;overflow:hidden;border-radius:8px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#6B6F76;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:700;color:#1E2024}
.bar{position:fixed;left:0;right:0;bottom:0;background:#141517;border-top:3px solid #FF8A1F;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#DCD3C6}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>

  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로형 광고. 숨구멍이 있는 짙은 현무암 판 위에 '돌담귤밭' 낙인이 찍힌 나무 수확 상자가 놓여 있고, 상자 안에는 잎이 섞인 귤이 수북이 쌓여 있으며 '오늘 아침 수확분' 크라프트 꼬리표가 걸려 있습니다. 위쪽에는 '올겨울 귤 한 상자, 밭에서 바로 보내요' 제목과 제주 노지감귤 · 수확 당일 발송 안내, 아래쪽 크림색 카드에는 5kg 29,000원과 10kg 49,000원 가격, 로열과·중과 크기 선택, 아침 수확·한 알씩 선별·당일 발송 순서, 초록 띠의 12월 첫 주문 귤칩 증정 문구와 연락처가 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
