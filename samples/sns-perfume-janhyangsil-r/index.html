<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잔향실 조향공방 · 12월 연말 2인 조향 클래스 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;background:#e4d9ec;color:#2b2340;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px);background-size:40px 40px}
.top{height:16px;background:linear-gradient(90deg,#ff8fa3,#ffc27a,#fff08a,#9fe3b5,#8fc2ff,#c49bff);position:relative;opacity:.8}
/*x*/.top::after{display:none;content:'';position:absolute;left:0;right:0;bottom:-16px;height:16px;background:radial-gradient(circle at 20px 0,#6e1f35 16px,transparent 17px) 0 0/80px 16px repeat-x,radial-gradient(circle at 60px 0,#fbf4ee 16px,transparent 17px) 0 0/80px 16px repeat-x}
.wrap{max-width:1200px;margin:0 auto;padding:50px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-size:14px;font-weight:700;letter-spacing:.2em;color:#2b2340}
.hd h1{font-family:'Gowun Batang',serif;font-weight:900;font-size:clamp(32px,4.4vw,54px);margin-top:8px;line-height:1.1;letter-spacing:-.01em}
.hd h1 em{font-style:normal;color:#561628;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:#fbf4ee;color:#3c3350;border:1.5px solid rgba(43,29,22,.2)}
.chips span.k{background:#2b2340;color:#fbf4ee;border-color:#2b2340;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:#6e1f35;color:#fbf4ee;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;border:2.5px solid #2b2340;box-shadow:4px 4px 0 #2b2340}
.cta:hover{background:#561628}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fbf4ee;padding:10px;border-radius:16px;border:2.5px solid #2b2340;box-shadow:6px 6px 0 #2b2340}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#5a4f6b;padding:10px 4px 2px;font-weight:500}
figcaption b{font-weight:700;color:#561628}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2b2340;border-top:3px solid #2b2340;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e7dcef}
.bar .cta{height:46px;box-shadow:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
 <div class="hd">
  <div>

   <h1>잔향실 조향공방 <em>12월 연말 2인 조향 클래스 20% 할인</em></h1>
   <div class="chips"><span class="k">연말 클래스 프로모션</span><span>원화 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="잔향실 피드 광고, 라일락빛 배경에 향수병과 레몬·라벤더, 2인 96,000원 20% 할인, 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="잔향실 세로 광고, 시향지와 향수병, 작은 원료 병 세 개, 가격 카드, 4:5" width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="잔향실 스토리 광고, 스포이트와 향수병, 클래스 진행 3단계와 가격, 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>

</body>
</html>
