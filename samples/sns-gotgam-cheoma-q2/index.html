<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>처마곶감 · 설 선물상자 SNS 광고 디자인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#D3DBDE}
body{word-break:keep-all;font-family:'Noto Sans KR',sans-serif;color:#24292C;background:#D3DBDE;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid rgba(36,41,44,.25)}
.hd small{font-size:14px;font-weight:500;color:#4D565B}
.hd h1{font-family:'Gowun Batang',serif;font-size:clamp(40px,5.6vw,68px);font-weight:700;line-height:1.08;letter-spacing:-.03em;margin-top:8px}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:clamp(16px,1.6vw,19px);font-weight:400;letter-spacing:0;color:#3A4246;margin-top:16px;line-height:1.65;max-width:760px}
.hd h1 em b{color:#A84C18;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#4D565B}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:8px;height:8px;border-radius:50%;background:#B4521A}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#3B342E;color:#F1EADC;font-weight:700;font-size:16px;text-decoration:none;border-radius:8px;transition:background-color .2s;white-space:nowrap}
.cta:hover{background:#544A41}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr .8fr .6fr;gap:24px;align-items:start}
figure{background:#EEE7D9;padding:8px 8px 0;border-radius:4px;box-shadow:0 14px 28px -20px rgba(30,36,40,.6)}
figure a{display:block;overflow:hidden;border-radius:2px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#5A5650;padding:12px 4px}
figcaption b{color:#24292C;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#3B342E;border-top:3px solid #B4521A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#D8D0C2}
.bar .cta{height:48px;background:#EEE7D9;color:#2C2621}
.bar .cta:hover{background:#DDD3C2}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:first-child{grid-column:span 2}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr}.grid figure:first-child{grid-column:auto}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS 광고 이미지 · SD-SN67</small>
   <h1>처마곶감 <em>산골 농원 처마 밑 감타래에서 60일 동안 찬바람으로 말린 곶감을 한지 상자에 담아 파는 가게의 2027년 설 선물 사전예약 광고입니다. 반건시 20입 상자 <b>39,000원</b>, 건시 30입 상자 <b>45,000원</b>, 1월 22일까지 주문하면 설 전에 택배로 받습니다.</em></h1>
   <div class="facts"><span>한국어 · 원화</span><span>겨울 하늘 회청 · 처마 나무 회갈 · 한지 미색 · 감 주황</span><span>피드 1:1 · 세로 4:5 · 스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="정사각형 피드 광고. 맨 위에 기와 끝 막새가 한 줄로 이어지고 그 아래 둥근 서까래 끝 나무 단면이 나란히 박힌 처마와 굵은 도리가 가로로 걸려 있습니다. 오른쪽 절반에는 처마 아래 가로 장대에서 늘어뜨린 길이가 서로 다른 다섯 줄의 감타래가 늘어져 있는데, 줄마다 꼭지에 실을 묶은 곶감이 고르지 않은 간격으로 좌우에 매달려 있습니다. 둥근 것, 납작하게 눌린 것, 아래가 뾰족한 것, 한쪽으로 기운 것 등 모양과 기울기가 제각각이고, 색은 호박빛 주황부터 짙은 밤갈색까지 섞여 있으며, 꼭지에서 퍼지는 깊은 주름과 마른 꽃받침, 몇 알에는 하얀 분이 보입니다. 그 뒤로 흐릿하게 한 겹 더 늘어선 감타래가 깊이를 만들고, 맨 오른쪽에는 나무 기둥이 서 있습니다. 바탕은 겨울 오후의 옅은 회청색 하늘과 멀리 겹친 산 능선입니다. 왼쪽 위에는 처마곶감 · 설 선물 사전예약, 그 아래 큰 명조체로 처마 밑 찬바람에 60일 말린 곶감이 네 줄로 적혀 있고, 아래 한지색 가격표에 반건시 20입 · 택배비 포함, 감 주황색 39,000원, 1월 22일까지 주문하면 설 전에 받습니다가 있습니다. 맨 아래에 카카오톡 ID: example." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 4:5 광고. 위쪽 한지색 띠에 처마곶감 · 2027 설 선물상자와 큰 명조체 제목 감타래에서 한 알씩 내려 한지 상자에 앉혔습니다가 있습니다. 가운데는 회갈색 툇마루 널빤지 위를 위에서 내려다본 장면으로, 살짝 기울어진 한지 상자 안에 주름진 종이 받침마다 반건시가 한 알씩 다섯 줄 네 단, 모두 스무 알 들어 있고, 알마다 눌린 모양과 놓인 방향, 가운데 마른 꽃받침에서 퍼지는 주름, 호박빛 색이 조금씩 다릅니다. 상자 왼쪽 아래에는 반으로 가른 반건시가 말랑한 주황 속과 가는 결을 보이고 옆에 통째 반건시 한 알이 놓여 있으며 속이 말랑한 반건시라는 지시선 글씨가 붙어 있습니다. 오른쪽에는 더 짙은 밤갈색에 하얀 분가루가 앉은 건시 네 알이 모여 있고 같은 이름의 지시선 글씨가, 오른쪽 아래에는 볏짚 몇 가닥이 있습니다. 오후 햇빛이 비스듬히 바닥에 걸쳐 있습니다. 아래 한지색 띠에 반건시 20입 39,000원과 건시 30입 45,000원이 두 칸으로 감 주황색 숫자로 나란히 있고, 그 아래 1월 22일까지 주문 · 설 전 택배 도착, 카카오톡 ID: example이 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="세로 9:16 스토리 광고. 위쪽 3분의 2는 처마 밑 회청색 회벽을 가까이서 본 장면입니다. 맨 위에 나무 도리와 장대가 가로로 걸려 있고, 장대에서 두 줄의 감타래가 늘어져 줄마다 곶감 다섯 알이 매달려 있습니다. 위에서 아래로 갈수록 말린 정도가 달라져, 맨 위는 갓 깎아 매끈한 밝은 주황, 그 아래는 조금씩 짙어지고 주름이 잡히다가, 맨 아래는 작아지고 짙은 밤갈색에 하얀 분이 앉은 건시입니다. 비스듬한 오후 햇빛에 감타래 그림자가 벽에 비껴 드리워 있습니다. 오른쪽 줄 옆에는 지시선과 함께 10월 하순 껍질 깎아 꼭지에 실 묶기, 보름째 겉이 마르며 색이 짙어짐, 30일째 찬바람에 주름이 잡힘, 45일 · 반건시 속은 아직 말랑하게, 60일 · 건시 겉에 하얀 분이 핌이 차례로 적혀 있습니다. 아래쪽은 가장자리가 살짝 찢긴 한지 판으로 처마곶감 · 설 선물 사전예약, 큰 명조체 제목 처마 밑 60일, 찬바람이 말린 곶감, 감 주황색 큰 숫자로 반건시 20입 39,000원부터, 그 아래 1월 22일까지 주문 · 설 전 도착과 카카오톡 ID: example이 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
