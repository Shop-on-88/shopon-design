<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해솔김방 · 설 선물 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#1B231F}
body{word-break:keep-all;font-family:'Noto Sans KR',sans-serif;color:#EDEAE0;background:#1B231F;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid rgba(243,231,211,.2)}
.hd small{font-size:14px;font-weight:500;color:#AEB7AE}
.hd h1{font-family:'Noto Serif KR',serif;font-size:clamp(40px,5.6vw,68px);font-weight:600;line-height:1.04;letter-spacing:-.02em;margin-top:8px}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:clamp(16px,1.6vw,19px);font-weight:400;letter-spacing:0;color:#CBD1C8;margin-top:16px;line-height:1.55;max-width:720px}
.hd h1 em b{color:#D9A64A;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#AEB7AE}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:8px;height:8px;border-radius:50%;background:#D9A64A}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#EDEAE0;color:#1B231F;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px;transition:background-color .2s;white-space:nowrap}
.cta:hover{background:#DCD8CA}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr .8fr .6fr;gap:24px;align-items:start}
figure{background:#252F2A;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(243,231,211,.12)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#AEB7AE;padding:12px 4px}
figcaption b{color:#EDEAE0;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#EDEAE0;border-top:3px solid #D9A64A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#45504A}
.bar .cta{height:48px;background:#1B231F;color:#EDEAE0}
.bar .cta:hover{background:#2F3B35}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:first-child{grid-column:span 2}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:first-child{grid-column:auto}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS 광고 이미지 · SD-SN62</small>
   <h1>해솔김방 <em>남해 갯마을 김 굽는 집의 설 선물 예약 광고. 곱창돌김 도시락 10봉과 재래 전장김 20매를 한지 띠지 상자에 담아 <b>32,000원</b>, 1월 10일까지 예약하면 택배비 무료</em></h1>
   <div class="facts"><span>한국어 · 원화</span><span>한지 미색 · 김 먹빛 · 들기름 금빛</span><span>피드 1:1 · 세로 4:5 · 스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="정사각형 피드 광고. 한지 질감의 미색 바탕 왼쪽 위에 해솔김방 이름과 남해 갯마을 김 굽는 집이라는 소개, 큰 명조체 제목 겨울 첫물 곱창돌김을 설 선물로 보냅니다, 들기름을 바르고 천일염을 쳐서 무쇠판에 한 장씩 굽는다는 설명이 있습니다. 오른쪽에는 결이 거친 먹빛 김 여러 장이 비스듬히 겹쳐 쌓여 있고, 가운데를 두른 한지 띠지에 세로로 곱창돌김과 붉은 해솔 낙관이 찍혀 있으며, 옆에 굵은 소금 접시와 들기름 병이 놓여 있습니다. 아래 짙은 상자에 해솔 설 선물상자, 곱창돌김 도시락 10봉과 재래 전장김 20매, 금빛 숫자 32,000원, 1월 10일까지 예약 시 택배비 무료가 적혀 있습니다." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 광고. 위쪽에 바닷바람에 말리고 무쇠판에 한 장씩이라는 제목과 갯마을 김발에서 말린 곱창김을 그날 굽고 상자에 담아 보낸다는 설명이 있습니다. 가운데는 회청색 겨울 바다와 모래사장을 배경으로 나무 김발 세 개가 서 있고, 김발마다 검은 김 네 장씩이 널려 있습니다. 아래 짙은 띠에 12월 첫물, 들기름·천일염, 구운 날 발송 세 가지 설명과 해솔 설 선물상자 32,000원, 택배비 무료 안내가 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리 광고. 갓 지은 밥 한 숟갈에 곱창김 한 장이라는 큰 제목 아래, 푸른 줄무늬가 있는 흰 밥그릇에 쌀알이 보이게 고봉으로 담긴 밥과 김을 얹은 숟가락, 옆에 놓인 김 한 장이 그려져 있습니다. 그 아래 선 아이콘과 함께 곱창돌김 도시락 10봉, 재래 전장김 20매, 한지 띠지 선물상자 1상자 구성이 적혀 있고, 짙은 상자에 32,000원과 1월 10일까지 예약·택배비 무료, 맨 아래 주문 카카오톡 ID 자리표시가 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게도 이런 광고 이미지가 필요하다면</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
