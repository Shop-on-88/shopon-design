<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kintab Auto Detailing · Holiday Social Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat','Noto Sans KR',sans-serif;background:#0f1112;color:#f4f6f1;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-size:13px;font-weight:600;letter-spacing:.24em;color:#d4f53c}
.hd h1{font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;margin-top:6px;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:600;background:#1d2023;border:1px solid #33383d;padding:6px 12px;border-radius:30px}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#d4f53c;color:#141618;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.cta:hover{background:#ecffa0}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#1d2023;padding:10px;border-radius:12px;border:1px solid #2a2e33}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:6px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#9aa29a;padding:10px 4px 2px}
figcaption b{color:#f4f6f1}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,22,24,.96);border-top:1px solid #2a2e33;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#c9cfc6}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}.bar .lg{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SOCIAL AD SET · SD-SN04</small>
   <h1>Kintab Auto Detailing<br>Holiday Shine Promo</h1>
   <div class="chips"><span>English · ₱ prices</span><span>Feed 1:1</span><span>Portrait 4:5</span><span>Story 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="Kintab feed ad 1:1" width="1080" height="1080"></a><figcaption><b>Feed</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="Kintab portrait ad 4:5" width="1080" height="1350"></a><figcaption><b>Portrait</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="Kintab story ad 9:16" width="1080" height="1920"></a><figcaption><b>Story</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>Want a seasonal ad set like this for your shop?</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기<span class="lg"> · Ask about this design</span></a></div>
</body>
</html>
