<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pahinga Pet Lodge · Holiday Boarding SNS Ad Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#10261C}
body{font-family:'Outfit',sans-serif;color:#F8ECD9;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 3px,transparent 3px 90px),radial-gradient(ellipse 60% 45% at 78% 8%,rgba(246,200,120,.22),transparent 70%),linear-gradient(170deg,#1B3B2C,#12291F 55%,#0D2018)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px}
.hd small{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.2em;background:#F6D27A;color:#22160F;padding:5px 11px;border-radius:4px}
.hd h1{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(36px,5vw,62px);margin-top:14px;line-height:1.05;letter-spacing:-.01em}
.hd h1 em{display:block;font-weight:500;font-style:italic;color:#F0A08E;font-size:.5em;margin-top:8px}
.hd h1 em b{font-family:'Outfit',sans-serif;font-style:normal;font-weight:700;color:#F6D27A}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;border:1.5px solid rgba(248,236,217,.35)}
.chips span.k{background:#D9786A;color:#FFF7EA;border-color:#D9786A;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#F6D27A;color:#22160F;font-weight:700;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap}
.cta:hover{background:#F8ECD9}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#F8ECD9;padding:10px 10px 4px;border-radius:14px;box-shadow:0 26px 46px -24px rgba(0,0,0,.75)}
figure a{display:block;overflow:hidden;border-radius:8px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#7A5A4C;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:700;color:#22160F}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0B1C14;border-top:3px solid #D9786A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#E6D8C2}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>

 <div class="hd">

 </div>
</div>

</html>
