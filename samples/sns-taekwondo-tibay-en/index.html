<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',sans-serif;background:#f3eee3;color:#13213f;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(900px 480px at 92% -8%,rgba(255,209,102,.35),transparent 65%),radial-gradient(rgba(19,33,63,.09) 1.2px,transparent 1.6px);background-size:auto,20px 20px}
.top{height:14px;display:flex;border-bottom:3px solid #13213f}
.top i{flex:1;display:block}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-size:14px;font-weight:800;letter-spacing:.2em;color:#e8402f}
.hd h1{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(30px,4.2vw,50px);margin-top:8px;line-height:1.08}
.hd h1 em{font-style:normal;color:#e8402f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:700;background:#fff;padding:6px 12px;border-radius:999px;color:#13213f;border:2px solid #13213f}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;background:#e8402f;color:#fff;font-weight:800;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;border:2px solid #13213f;box-shadow:5px 5px 0 #13213f}
.cta:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 #13213f}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px;border-radius:16px;border:2px solid #13213f;box-shadow:6px 6px 0 #13213f}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#4a5878;padding:10px 4px 2px}
figcaption b{color:#e8402f;font-weight:800}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(19,33,63,.97);border-top:3px solid #ffd166;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#d9e0ef}
.bar .cta{height:46px;box-shadow:none;border-color:#ffd166}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
