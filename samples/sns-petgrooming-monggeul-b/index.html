<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#eaf5fc;color:#173d5a;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(700px 420px at 92% -8%,rgba(244,144,106,.22),transparent 65%),radial-gradient(circle at 8% 30%,rgba(255,255,255,.9) 0 90px,transparent 91px),radial-gradient(circle at 14% 22%,rgba(255,255,255,.7) 0 34px,transparent 35px)}

.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;letter-spacing:.22em;color:#2a7fb8}
.hd h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(34px,4.6vw,54px);margin-top:8px;line-height:1.15}
.hd h1 em{font-style:normal;color:#e9744f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;background:#fff;padding:6px 12px;border-radius:20px;color:#3e6481;border:1px solid #cfe3f1}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#f4906a;color:#fff;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 5px 0 #c8603f}
.cta:hover{transform:translateY(2px);box-shadow:0 3px 0 #c8603f}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px;border-radius:22px;box-shadow:0 26px 50px -26px rgba(23,61,90,.45)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:14px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#6b8da6;padding:10px 6px 2px}
figcaption b{color:#173d5a;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(31,111,166,.97);border-top:3px solid #f4906a;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e2f1fb}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
