<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노래상자 코인노래방 · 겨울방학 이벤트 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Monoton&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0c0822 radial-gradient(900px 520px at 90% -10%,rgba(255,79,174,.28),transparent 60%);color:#f1edff;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Monoton',cursive;font-size:17px;letter-spacing:.12em;color:#7ff3ff;text-shadow:0 0 12px rgba(62,232,255,.6)}
.hd h1{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(30px,4.2vw,46px);margin-top:10px;line-height:1.25}
.hd h1 em{font-style:normal;color:#ff4fae;text-shadow:0 0 18px rgba(255,79,174,.55)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;border:1.5px solid rgba(127,243,255,.5);padding:6px 12px;border-radius:30px;color:#cfe9f2}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:linear-gradient(90deg,#ff4fae,#9b4dff);color:#fff;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 0 26px rgba(255,79,174,.45)}
.cta:hover{filter:brightness(1.1)}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#160f38;padding:10px;border-radius:18px;border:1px solid rgba(127,243,255,.22);box-shadow:0 24px 50px -28px rgba(0,0,0,.8)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:10px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#a99fd4;padding:10px 4px 2px}
figcaption b{color:#f1edff;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,8,34,.96);border-top:1px solid rgba(255,79,174,.4);padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#cdc5ef}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SOCIAL AD SET · SD-SN11</small>
   <h1>노래상자 코인노래방<br><em>겨울방학 1시간 부르면 30분 더</em></h1>
   <div class="chips"><span>코인노래방 · 노래연습장</span><span>원화 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="노래상자 겨울방학 이벤트 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="노래상자 요금 안내 세로 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="노래상자 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 이벤트도 이런 네온 세트로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
