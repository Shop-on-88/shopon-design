<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몽돌비누 · 연말 선물 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#2C3236}
body{word-break:keep-all;font-family:'Noto Sans KR',sans-serif;color:#EEEBE4;background:#2C3236;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid rgba(238,235,228,.2)}
.hd small{font-size:14px;font-weight:500;color:#AEB4B6}
.hd h1{font-family:'Gowun Batang',serif;font-size:clamp(40px,5.6vw,68px);font-weight:700;line-height:1.04;letter-spacing:-.02em;margin-top:8px}
.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:clamp(16px,1.6vw,19px);font-weight:400;letter-spacing:0;color:#C9CED0;margin-top:16px;line-height:1.55;max-width:720px}
.hd h1 em b{color:#E39A45;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#AEB4B6}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:8px;height:8px;border-radius:50%;background:#E39A45}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#EEEBE4;color:#2C3236;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px;transition:background-color .2s;white-space:nowrap}
.cta:hover{background:#DDD9D0}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr .8fr .6fr;gap:24px;align-items:start}
figure{background:#363D42;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(238,235,228,.12)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#AEB4B6;padding:12px 4px}
figcaption b{color:#EEEBE4;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#EEEBE4;border-top:3px solid #E39A45;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#4F575B}
.bar .cta{height:48px;background:#2C3236;color:#EEEBE4}
.bar .cta:hover{background:#3D454A}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:first-child{grid-column:span 2}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:first-child{grid-column:auto}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS 광고 이미지 · SD-SN63</small>
   <h1>몽돌비누 <em>4주 숙성 저온법 수제비누 공방의 연말 선물 광고. 올리브·칼렌듈라·숯·귀리우유 비누 네 가지를 칸 나뉜 상자에 담아 <b>28,000원</b>, 12월 15일까지 주문하면 이름 각인 무료</em></h1>
   <div class="facts"><span>한국어 · 원화</span><span>몽돌 회백 · 슬레이트 · 칼렌듈라 주황</span><span>피드 1:1 · 세로 4:5 · 스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="정사각형 피드 광고. 몽돌처럼 매끈한 회백색 바탕 왼쪽 위에 몽돌비누 이름과 저온법 수제비누 공방이라는 소개, 큰 바탕체 제목 자른 날부터 4주, 선반에서 기다린 비누가 있고 기다린만 주황색입니다. 올리브유와 코코넛유를 낮은 온도에서 섞어 틀에 붓고 이틀 뒤 칼로 자른다는 설명 아래, 오른쪽 나무 도마 위에 아래는 올리브색, 위는 미색, 가운데 숯빛 물결선이 지나가는 큰 비누 덩어리가 놓여 있고 윗면에 주황 칼렌듈라 꽃잎이 흩어져 있습니다. 옆에 같은 층이 보이는 자른 비누 두 개와 도마 앞에 비누 칼이 누워 있습니다. 아래 짙은 상자에 12월 연말 선물 몽돌 4구 선물상자, 12월 15일까지 주문하면 이름 각인 무료, 주황 숫자 28,000원이 있습니다." width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 광고. 위쪽에 11월에 자른 비누를 12월에 보냅니다라는 큰 제목과 자른 비누를 바람 드는 선반에 세워 4주를 둔다는 설명이 있습니다. 가운데는 나무 숙성 선반 두 칸에 층이 진 올리브 비누, 숯 비누, 꽃잎 비누, 귀리 비누, 초록 비누가 줄지어 세워져 있고, 위 칸 아래에 11/02 자름, 11/09 자름, 11/16 자름 날짜 꼬리표가 붙어 있으며 마지막 꼬리표만 주황색입니다. 아래 짙은 띠에 12월 15일까지 주문, 몽돌 4구 선물상자와 이름 각인 무료, 숙성이 끝난 비누만 넣어 12월 1일부터 보낸다는 안내와 28,000원이 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리 광고. 상자를 열면 네 가지 몽돌이라는 큰 제목과 면끈으로 하나씩 묶어 칸이 나뉜 오동나무 상자에 담는다는 설명 아래, 위에서 내려다본 나무 상자 네 칸에 올리브색, 꽃잎이 박힌 살구색, 숯색, 귀리 점이 박힌 미색 비누가 면끈으로 십자 묶여 담겨 있고, 뒤에 상자 뚜껑이 비스듬히 기대어 있으며, 하윤에게라고 쓴 이름 각인 예시 꼬리표가 달려 있습니다. 아래에 올리브, 칼렌듈라, 숯, 귀리우유 몽돌 각 100g 목록과 짙은 상자 속 28,000원, 맨 아래 주문 카카오톡 ID 자리표시와 택배비 안내가 있습니다." width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>

</body>
</html>
