*{box-sizing:border-box;margin:0;padding:0}

figure{background:#232859;padding:10px;border-radius:18px;border:1px solid rgba(255,217,160,.18);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
figure a{display:block}

figcaption{display:flex;justify-content:space-between;font-size:13px;color:#a9aed0;padding:10px 4px 2px}
figcaption b{color:#ffd9a0;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,23,58,.97);border-top:2px solid #ffd9a0;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#c9cce4}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
