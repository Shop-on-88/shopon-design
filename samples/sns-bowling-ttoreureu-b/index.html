<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>또르르 볼링센터 · 연말 단체 레인 예약 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f6ead2;color:#3a2014;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(rgba(58,32,20,.07) 1px,transparent 1.4px),radial-gradient(900px 520px at 100% -10%,rgba(30,158,154,.22),transparent 65%);background-size:8px 8px,auto}
.top{height:20px;background:repeating-linear-gradient(90deg,#c8243a 0 40px,#f6ead2 40px 48px,#1e9e9a 48px 88px,#f6ead2 88px 96px)}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;letter-spacing:.22em;color:#11706f}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(32px,4.4vw,50px);margin-top:8px;line-height:1.18}
.hd h1 em{font-style:normal;color:#c8243a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;border:1.5px solid rgba(58,32,20,.22);background:rgba(255,250,238,.85);padding:6px 12px;border-radius:30px;color:#4a3324}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#c8243a;color:#fff6e3;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:4px 4px 0 #3a2014}
.cta:hover{background:#11706f}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fffaf0;padding:10px;border-radius:16px;border:2px solid #3a2014;box-shadow:8px 8px 0 #1e9e9a}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:9px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#6b5240;padding:10px 4px 2px}
figcaption b{color:#3a2014;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(17,112,111,.97);border-top:3px solid #c8243a;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e8f7f4}
.bar .cta{height:46px;background:#ffe2a6;color:#3a2014;box-shadow:none}
.bar .cta:hover{background:#fff6e3}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SOCIAL AD SET · SD-SN22</small>
   <h1>또르르 볼링센터<br><em>연말 단체 레인 예약</em></h1>
   <div class="chips"><span>볼링장 연말 단체 이벤트</span><span>원화 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="또르르 볼링센터 연말 단체 레인 예약 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="또르르 볼링센터 레인과 패키지 구성 세로 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="또르르 볼링센터 점수표 스타일 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 연말 이벤트도 이런 세트로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
