<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocha Lane · Menu Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit','Noto Sans KR',sans-serif;background:#ece4d3;color:#1f2a56;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:40px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:30px}
.hd small{font-size:13px;font-weight:600;letter-spacing:.18em;color:#e0452c}
.hd h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:13px;font-weight:600;background:#fff8ea;border:1.5px solid #1f2a56;padding:5px 12px;border-radius:30px}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;border-radius:40px;background:#e0452c;color:#fff;font-weight:700;font-size:15px;text-decoration:none;box-shadow:4px 4px 0 #1f2a56;transition:.2s;font-family:'Noto Sans KR',sans-serif}
.cta:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #1f2a56}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pages figure{background:#fff;padding:10px;border-radius:6px;box-shadow:0 24px 50px -20px rgba(31,42,86,.45)}
.pages a{display:block}
.pages img{display:block;width:100%;height:auto;border-radius:2px}
.pages figcaption{font-size:13px;color:#6b6a7a;padding:10px 4px 2px;display:flex;justify-content:space-between}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(31,42,86,.96);color:#fff;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;opacity:.85}
.bar .cta{height:46px;box-shadow:none;background:#f0b030;color:#1f2a56;white-space:nowrap}
@media(max-width:760px){.pages{grid-template-columns:1fr}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}.bar .lg{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>MENU DESIGN · SD-MN04</small>
   <h1>Pocha Lane — Korean Street Food</h1>
   <div class="chips"><span>A4 portrait · 2 pages</span><span>English menu</span><span>Prices in ₱</span><span>Print &amp; online</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="pages">
  <figure><a href="page1.png" target="_blank" rel="noopener"><img src="page1.png" alt="Pocha Lane menu page 1" width="2480" height="3508"></a><figcaption><span>Page 1 · Tteokbokki, gimbap, fried, soup</span><span>Tap to enlarge</span></figcaption></figure>
  <figure><a href="page2.png" target="_blank" rel="noopener"><img src="page2.png" alt="Pocha Lane menu page 2" width="2480" height="3508" loading="lazy"></a><figcaption><span>Page 2 · Sweets, drinks, sets</span><span>Tap to enlarge</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>Want a menu like this for your shop?</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기<span class="lg"> · Ask about this design</span></a></div>
</body>
</html>
