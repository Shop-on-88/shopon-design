<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물살수산 · 12월 대게 예약 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;color:#13243A;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:linear-gradient(115deg,transparent 0 46%,rgba(255,255,255,.55) 46% 46.4%,transparent 46.4%) 0 0/560px 560px,radial-gradient(ellipse 80% 60% at 50% 0%,#F4FBFE,#CFE7F2 70%,#B5D9EA)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px;background:#fff;border-radius:18px;padding:28px 30px;box-shadow:0 20px 40px -24px rgba(14,53,80,.4);border-top:8px solid #D7361F}
.hd small{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.2em;background:#13243A;color:#fff;padding:5px 11px}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(32px,4.4vw,54px);margin-top:12px;line-height:1.15}
.hd h1 em{font-style:normal;color:#D7361F;display:block;font-size:.6em;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;background:#EAF5FA;border:1.5px solid #B5D9EA}
.chips span.k{background:#D7361F;color:#fff;border-color:#D7361F}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#D7361F;color:#fff;font-weight:700;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap}
.cta:hover{background:#13243A}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px 10px 4px;border-radius:14px;box-shadow:0 24px 44px -26px rgba(14,53,80,.55)}
figure a{display:block;overflow:hidden;border-radius:8px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#4C6478;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:700;color:#13243A}
.bar{position:fixed;left:0;right:0;bottom:0;background:#13243A;border-top:4px solid #D7361F;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#CFE7F2}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.hd{padding:22px 18px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SNS AD SET · SD-SN47</small>
   <h1>물살수산 <em>12월 대게 예약 1kg 59,000원 + 찜 무료</em></h1>
   <div class="chips"><span class="k">수산시장 경매표 가격 태그</span><span>12월 한정</span><span>얼음 블루 & 대게 레드 & 스티로폼 화이트</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="물살수산 피드 광고, 얼음빛 하늘색 바탕에 대게 철이 왔습니다 큰 제목, 왼쪽 크라프트 경매표 모양 가격표에 대게 1kg 59,000원과 예약 시 찜 무료 도장, 오른쪽 스티로폼 상자 위 빨간 대게 그림, 아래 남색 띠에 주문 안내" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="물살수산 세로 광고, 위 제목, 가운데 경매표 가격표와 스티로폼 상자 위 대게, 왼쪽 아래 받는 날 아침 경매분·찜 손질 무료 안내 칩, 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="물살수산 스토리 광고, 가운데 정렬 제목과 12월 한 달 받는 날 맞춰 예약 띠, 상자 위 대게, 아래 가로형 가격표와 주문 안내, 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 광고 이미지도 이렇게 만들고 싶다면</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
