<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E4E6E4}
body{word-break:keep-all;font-family:'IBM Plex Sans KR',sans-serif;color:#1B2023;background:#E4E6E4;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:2px solid #1B2023}
.hd small{font-size:14px;font-weight:600;color:#4A5254;font-family:'IBM Plex Sans KR',sans-serif}
.hd h1{font-family:'IBM Plex Sans KR',sans-serif;font-size:clamp(34px,4.8vw,58px);font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:8px}
.hd h1 em{display:block;font-family:'IBM Plex Sans KR',sans-serif;font-style:normal;font-size:.42em;font-weight:500;color:#4A5254;margin-top:12px;letter-spacing:0}
.hd h1 em b{color:#8A6A0E;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#4A5254}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:10px;height:10px;border-radius:2px;background:#8A6A0E}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#1B2023;color:#fff;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px;transition:background .2s;white-space:nowrap}
.cta:hover{background:#3A4347}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#F4F5F3;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(27,32,35,.16);box-shadow:0 24px 40px -28px rgba(27,32,35,.6)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#4A5254;padding:12px 4px}
figcaption b{color:#1B2023;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1B2023;border-top:3px solid #F0C43A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#B7BCBC}
.bar .cta{height:48px;background:#F0C43A;color:#1B2023}
.bar .cta:hover{background:#F5D466}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
