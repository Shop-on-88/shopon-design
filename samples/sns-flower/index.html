<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>들꽃상점 · 연말 꽃 예약 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#efe6dc;color:#3a1a20;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:34px}
.hd small{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:#b48a4a}
.hd h1{font-family:'Gowun Batang',serif;font-size:clamp(28px,4vw,40px);color:#6b1729;letter-spacing:-.02em;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:13px;font-weight:500;background:#fff;border:1px solid #e0cfc4;padding:5px 12px;border-radius:30px}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#6b1729;color:#fff;font-weight:700;font-size:15px;text-decoration:none;transition:.2s}
.cta:hover{background:#8f2a3c}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px;border-radius:10px;box-shadow:0 24px 50px -24px rgba(107,23,41,.45)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:4px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#7d6064;padding:10px 4px 2px}
figcaption b{color:#3a1a20;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(58,26,32,.96);color:#fff;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;opacity:.85}
.bar .cta{height:46px;background:#e9c3bd;color:#3a1a20}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>Social Ad Set · SD-SN03</small>
   <h1>들꽃상점 연말 꽃 예약</h1>
   <div class="chips"><span>꽃집</span><span>피드 1:1</span><span>세로 피드 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="들꽃상점 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="들꽃상점 세로 피드 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="들꽃상점 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 시즌 광고도 이런 세트로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
