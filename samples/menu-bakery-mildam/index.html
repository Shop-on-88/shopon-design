<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀담 베이커리 · 메뉴판 디자인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#e6d3ae;color:#3b2418;word-break:keep-all;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(255,246,225,.6),rgba(255,246,225,0) 70%)}
.wrap{max-width:1240px;margin:0 auto;padding:44px 20px 120px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:32px}
.hd small{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;letter-spacing:.06em;color:#b4572f}
.hd h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(30px,4.2vw,44px);letter-spacing:-.01em;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:13px;font-weight:500;background:#f6ebd3;border:1.5px solid #3b2418;padding:5px 12px;border-radius:30px}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:#3b2418;color:#f6ebd3;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap}
.cta:hover{background:#5b3b29}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pages figure{background:#f6ebd3;padding:10px;border-radius:6px;box-shadow:0 26px 50px -22px rgba(59,36,24,.55)}
.pages a{display:block}
.pages img{display:block;width:100%;height:auto;border-radius:3px}
.pages figcaption{font-size:13px;color:#5b3b29;padding:10px 4px 2px;display:flex;justify-content:space-between;gap:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(59,36,24,.97);color:#f6ebd3;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;opacity:.85}
.bar .cta{height:46px;background:#f2cf6e;color:#3b2418}
.bar .cta:hover{background:#f8e3a4}
@media(max-width:760px){.pages{grid-template-columns:1fr}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>Menu design · SD-MN06</small>
   <h1>밀담 베이커리 메뉴판</h1>
   <div class="chips"><span>A4 세로 · 2페이지</span><span>사워도우 베이커리</span><span>원화 가격</span><span>인쇄 · 웹 겸용</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="pages">
  <figure><a href="page1.png" target="_blank" rel="noopener"><img src="page1.png" alt="밀담 베이커리 메뉴판 1페이지" width="2480" height="3508"></a><figcaption><span>1페이지 · 식사빵·크루아상</span><span style="white-space:nowrap">눌러서 크게 보기</span></figcaption></figure>
  <figure><a href="page2.png" target="_blank" rel="noopener"><img src="page2.png" alt="밀담 베이커리 메뉴판 2페이지" width="2480" height="3508" loading="lazy"></a><figcaption><span>2페이지 · 구움과자·브런치·음료·세트</span><span style="white-space:nowrap">눌러서 크게 보기</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 메뉴판도 이런 느낌으로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
