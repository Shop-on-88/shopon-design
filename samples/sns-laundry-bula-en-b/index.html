<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f3ede2;color:#211d1a;-webkit-font-smoothing:antialiased;min-height:100vh;

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

.cta:hover{transform:translateY(2px);box-shadow:0 3px 0 #b8301c}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fbf8f2;padding:10px;border-radius:14px;box-shadow:0 26px 50px -26px rgba(90,50,20,.45);position:relative}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:6px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#7c7268;padding:10px 4px 2px}
figcaption b{color:#e0432a;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(33,29,26,.97);border-top:3px solid #e0432a;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e6d9c3}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
