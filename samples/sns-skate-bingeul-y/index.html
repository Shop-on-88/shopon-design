<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#1B2340}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;color:#FFF4E4;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(circle at 1px 1px,rgba(255,243,222,.08) 1.5px,transparent 2px) 0 0/26px 26px,radial-gradient(ellipse 70% 50% at 80% 0%,#2C3866,#222C52 60%,#1B2340)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px}
.hd small{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.2em;background:#FF8A99;color:#1B2340;padding:5px 11px;border-radius:4px}
.hd h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(36px,5vw,62px);margin-top:14px;line-height:1.05}
.hd h1 em{font-style:normal;color:#FF8A99;display:block;font-size:.5em;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;border:1.5px solid rgba(255,243,222,.35)}
.chips span.k{background:#D7263D;color:#FFF4E4;border-color:#D7263D}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#FFF4E4;color:#1B2340;font-weight:700;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap}
.cta:hover{background:#FF8A99}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#FFF4E4;padding:10px 10px 4px;border-radius:14px;box-shadow:0 24px 44px -24px rgba(5,10,50,.7)}
figure a{display:block;overflow:hidden;border-radius:8px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#5A6385;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:700;color:#1B2340}
.bar{position:fixed;left:0;right:0;bottom:0;background:#141A31;border-top:3px solid #FF8A99;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#D3D8EC}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
