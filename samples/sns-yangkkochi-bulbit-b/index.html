<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>불빛 양꼬치 · 연말 단체 회식 예약 SNS 광고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#082527;color:#f6ead2;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(ellipse 70% 45% at 50% 105%,rgba(255,106,31,.32),transparent 70%),radial-gradient(ellipse 60% 40% at 0% 0%,rgba(21,89,90,.7),transparent 70%)}
.wrap{max-width:1200px;margin:0 auto;padding:48px 20px 130px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:36px;padding-bottom:28px;border-bottom:1.5px solid rgba(227,162,74,.35)}
.hd small{font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;letter-spacing:.2em;color:#e3a24a}
.hd h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(32px,4.4vw,50px);margin-top:10px;line-height:1.2}
.hd h1 em{font-style:normal;background:linear-gradient(180deg,#ffd585,#e3992f);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:13px;font-weight:500;border:1.5px solid rgba(227,162,74,.45);padding:6px 12px;border-radius:30px;color:#e9dcc0;background:rgba(6,26,27,.5)}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:40px;background:linear-gradient(180deg,#ffc163,#e3992f);color:#0b2e30;font-weight:700;font-size:15px;text-decoration:none;transition:.2s;white-space:nowrap;box-shadow:0 12px 26px -12px rgba(255,120,30,.7)}
.cta:hover{filter:brightness(1.08)}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#0e3739;padding:10px;border-radius:14px;border:1px solid rgba(227,162,74,.25);box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
figure a{display:block}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#a9cbc6;padding:10px 4px 2px}
figcaption b{color:#ffc163;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(6,24,25,.96);border-top:1px solid rgba(227,162,74,.3);padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#e9dcc0}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;margin:0 auto;width:100%}}
@media(max-width:620px){.wrap{padding-top:32px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hd">
  <div>
   <small>SOCIAL AD SET · SD-SN20</small>
   <h1>불빛 양꼬치<br><em>연말 단체 회식 예약</em></h1>
   <div class="chips"><span>교민 양꼬치집 시즌 이벤트</span><span>페소 가격</span><span>피드 1:1</span><span>세로 4:5</span><span>스토리 9:16</span></div>
  </div>
  <a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기 <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>
 <div class="grid">
  <figure><a href="feed.png" target="_blank" rel="noopener"><img src="feed.png" alt="불빛 양꼬치 연말 단체 회식 피드 광고 1:1" width="1080" height="1080"></a><figcaption><b>피드</b><span>1080 × 1080</span></figcaption></figure>
  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="불빛 양꼬치 회식 세트 구성 세로 광고 4:5" width="1080" height="1350"></a><figcaption><b>세로 피드</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="불빛 양꼬치 단체 예약 방법 스토리 광고 9:16" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>
<div class="bar"><p>우리 가게 연말 이벤트도 이런 광고 이미지로 만들어 보세요</p><a class="cta" href="https://design.shoponph.online/#inquiry">이 디자인으로 상담하기</a></div>
</body>
</html>
