<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은결 반지공방 · 연말 커플링 클래스 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;500;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#2A323E}
body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;color:#F2EEE8;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 2px,transparent 2px 10px),radial-gradient(ellipse 55% 40% at 85% 0%,rgba(233,184,168,.16),transparent 70%),linear-gradient(165deg,#465265,#2A323E 50%,#222934)}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px;padding-bottom:30px;border-bottom:1.5px solid rgba(242,238,232,.3)}
.hd small{font-family:Montserrat;font-weight:700;font-size:13px;letter-spacing:.24em;color:#E9B8A8}
.hd h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(36px,5vw,60px);margin-top:12px;line-height:1.15;letter-spacing:-.02em}
.hd h1 em{font-style:normal;display:block;font-family:'Noto Sans KR';font-weight:700;font-size:.42em;margin-top:10px;color:#C9D2DC;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:500;padding:6px 13px;border-radius:30px;border:1.5px solid rgba(242,238,232,.35);color:#E6EAF0}
.chips span.k{background:#E9B8A8;color:#2A323E;border-color:#E9B8A8;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#E9B8A8;color:#2A323E;font-weight:700;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap}
.cta:hover{background:#F2EEE8}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:rgba(242,238,232,.06);padding:10px 10px 4px;border-radius:14px;border:1.5px solid rgba(242,238,232,.22);box-shadow:0 30px 50px -28px rgba(0,0,0,.7)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#B9C3CE;padding:10px 4px 6px}
figcaption b{font-weight:700;color:#F2EEE8}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1C222B;border-top:1.5px solid rgba(233,184,168,.5);padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#D3DAE2}
.bar .cta{height:46px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
