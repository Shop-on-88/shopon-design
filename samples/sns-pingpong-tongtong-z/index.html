<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통통 탁구클럽 · 겨울 입문반 SNS 광고 세트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=Archivo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:#F5EFE2}
body{font-family:'Gothic A1',sans-serif;word-break:keep-all;color:#14243A;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:repeating-linear-gradient(90deg,rgba(20,36,58,.04) 0 2px,transparent 2px 54px),radial-gradient(ellipse 60% 45% at 92% 0%,rgba(255,106,19,.16),transparent 70%),#F5EFE2}
.wrap{max-width:1200px;margin:0 auto;padding:46px 20px 150px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px;padding-bottom:30px;border-bottom:4px solid #1C6B82;position:relative}
.hd small{display:inline-flex;align-items:center;gap:8px;font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.2em;color:#1C6B82}
.hd small:before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFC296,#FF6A13 55%,#E84E00)}
.hd h1{font-weight:900;font-size:clamp(38px,5vw,62px);margin-top:12px;line-height:1.08;letter-spacing:-.03em}
.hd h1 em{font-style:normal;color:#FF6A13;display:block;font-size:.48em;margin-top:8px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.chips span{font-size:13px;font-weight:700;padding:6px 13px;border-radius:30px;border:2px solid #14243A}
.chips span.k{background:#1C6B82;color:#fff;border-color:#1C6B82}
.cta{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;background:#FF6A13;color:#fff;font-weight:900;font-size:15px;text-decoration:none;border-radius:40px;transition:.2s;white-space:nowrap;box-shadow:0 10px 20px -10px rgba(232,78,0,.6)}
.cta:hover{background:#14243A}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr .78fr;gap:24px;align-items:start}
figure{background:#fff;padding:10px 10px 4px;border-radius:14px;box-shadow:0 24px 44px -26px rgba(19,80,106,.55);border:2px solid #1C6B82}
figure a{display:block;overflow:hidden;border-radius:8px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:#5B6676;padding:10px 4px 6px;font-weight:500}
figcaption b{font-weight:900;color:#14243A}
.bar{position:fixed;left:0;right:0;bottom:0;background:#14243A;border-top:4px solid #1C6B82;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.bar p{font-size:14px;color:#E4DDCD}
.bar .cta{height:46px;box-shadow:none}
.bar .cta:hover{background:#1C6B82}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:last-child{grid-column:span 2;max-width:420px;width:100%;margin:0 auto}}
@media(max-width:620px){.wrap{padding:26px 16px 120px}.grid{grid-template-columns:1fr;gap:26px}.grid figure:last-child{grid-column:auto;max-width:none}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
</style>
</head>
<body>

 </div>

  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로형. 위에 로고와 개강 태그, 두 줄 제목, 가운데 탁구대와 공 궤적·라켓 그림 위에 가격 카드, 아래 1주 그립·자세부터 4주 서브·랠리까지 공 모양 번호의 커리큘럼 타임라인, 남색 신청 띠" width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
  <figure><a href="story.png" target="_blank" rel="noopener"><img src="story.png" alt="스토리형. 가운데 정렬 로고와 제목, 정면에서 본 탁구대 위로 공이 네트를 넘는 그림, 탁구대 앞 가운데 가격 카드, 4주 커리큘럼과 둥근 남색 신청 버튼을 안전 영역 안에 배치" width="1080" height="1920"></a><figcaption><b>스토리</b><span>1080 × 1920</span></figcaption></figure>
 </div>
</div>

</body>
</html>
