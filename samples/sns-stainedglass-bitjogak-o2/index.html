<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#EFE9DE}

.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 136px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:40px;padding-bottom:32px;border-bottom:2px solid #2B2A2E}
.hd small{font-size:14px;font-weight:500;color:#5A5650}

.hd h1 em{display:block;font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:clamp(16px,1.6vw,19px);font-weight:400;letter-spacing:0;color:#4A4741;margin-top:16px;line-height:1.6;max-width:720px}
.hd h1 em b{color:#A8243A;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px;color:#5A5650}
.facts span{display:flex;align-items:center;gap:8px}
.facts span:before{content:"";width:8px;height:8px;background:#A8243A;transform:rotate(45deg)}
.cta{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;background:#2B2A2E;color:#F4F0E8;font-weight:700;font-size:16px;text-decoration:none;border-radius:8px;transition:background-color .2s;white-space:nowrap}
.cta:hover{background:#45434A}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr .8fr .6fr;gap:24px;align-items:start}
figure{background:#F7F3EB;padding:8px 8px 0;border-radius:12px;border:1px solid rgba(43,42,46,.14);box-shadow:0 16px 32px -24px rgba(43,42,46,.5)}
figure a{display:block;overflow:hidden;border-radius:6px}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#5A5650;padding:12px 4px}
figcaption b{color:#2B2A2E;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2B2A2E;border-top:3px solid #A8243A;padding:12px 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;z-index:10}
.bar p{font-size:15px;color:#CFCAC2}
.bar .cta{height:48px;background:#F4F0E8;color:#2B2A2E}
.bar .cta:hover{background:#E3DDD2}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:first-child{grid-column:span 2}.hd{grid-template-columns:1fr}.hd .cta{justify-self:start}}
@media(max-width:620px){.wrap{padding:28px 16px 112px}.grid{grid-template-columns:1fr;gap:24px}.grid figure:first-child{grid-column:auto}.hd .cta{display:none}.bar p{display:none}.bar .cta{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  <figure><a href="portrait.png" target="_blank" rel="noopener"><img src="portrait.png" alt="세로 광고. 짙은 녹색 커팅 매트 위에 살짝 기운 미색 도안지가 놓여 있습니다. 도안지 왼쪽에는 연필선으로 그린 원형 별 썬캐처 도안에 조각 번호 1부터 15까지가 적혀 있고, 오른쪽에는 구리색 동박을 감은 앰버 별 조각 열 개와 루비·청록·하늘색 바탕 조각 세 개가 도안 모양대로 조금씩 떨어져 놓여 있습니다. 도안지 위쪽 모서리에 검은 손잡이의 유리 커터, 왼쪽 아래에 구리색 동박 테이프 롤이 있습니다. 위쪽 글씨는 빛조각 스테인드글라스 공방 · 12월 원데이, 큰 제목 도안 위에 유리를 놓고 자르고, 감고, 땜합니다, 그리고 40분 유리 자르기, 30분 모서리 갈기, 40분 동박 감기, 50분 납땜과 고리 네 단계입니다. 맨 아래 미색 띠에 12월 토·일 오후 2시 · 재료 포함, 예약 카카오톡 ID: example, 오른쪽에 2인 한 팀 58,000원(루비색)이 있습니다." width="1080" height="1350"></a><figcaption><b>세로형</b><span>1080 × 1350</span></figcaption></figure>
